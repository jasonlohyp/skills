<!-- Bar chart. Bars grow from the baseline, one after another.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-chart c-bars" data-fs="bars" data-max="100" data-highlight="0" data-items='[["REPLACE",80],["REPLACE",50],["REPLACE",30]]'>
    <!-- data-highlight = the bar in the accent colour, -1 for none -->
    <header><h3>REPLACE title</h3><span data-edit>REPLACE source</span></header>
    <svg></svg>
  </div>
</div>
