<!-- Line chart. Lines draw, the area fades in and dots pop.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-chart c-line" data-fs="line" data-max="100" data-labels='["REPLACE","REPLACE","REPLACE"]'
       data-series='[{"name":"REPLACE","color":"var(--accent)","values":[10,40,80]}]'>
    <header><h3>REPLACE title</h3><span data-edit>REPLACE source</span></header>
    <svg></svg>
    <div class="legend"></div>
    <div class="tip"></div>
  </div>
</div>
