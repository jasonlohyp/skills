<!-- Statement. Words rise from a mask and a line draws.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-statement" data-fs="statement" data-text="REPLACE one sentence." data-em="sentence.">
    <p class="eyebrow">REPLACE</p>
    <h2></h2>                                  <!-- words are built from data-text -->
    <div class="ul"></div>
  </div>
</div>
