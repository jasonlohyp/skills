<!-- Before and after. It sweeps by itself, then the viewer can drag it.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-cmp" data-fs="cmp" data-to="50">   <!-- data-to = where the sweep stops, 0 to 100 -->
    <div class="layer before"><span class="tag" data-edit>Before</span><div class="val" data-edit>REPLACE</div><p class="txt">REPLACE</p></div>
    <div class="layer after"><span class="tag" data-edit>After</span><div class="val" data-edit>REPLACE</div><p class="txt">REPLACE</p></div>
    <div class="handle"></div>
  </div>
</div>
