<!-- KPI counter. Numbers count up to the value in the text, so edits just work.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-kpi" data-fs="kpi">
    <div>
      <div class="big"><span data-count data-edit>REPLACE 0</span><small data-edit>%</small></div>
      <p class="cap">REPLACE what this number means</p>
      <div class="meter" style="--v:.5"><i></i></div>   <!-- --v = 0 to 1 fill -->
    </div>
    <div class="row">
      <div><strong data-edit><span data-count>REPLACE 0</span> unit</strong><span data-edit>REPLACE label</span></div>
      <div><strong data-edit><span data-count>REPLACE 0</span> unit</strong><span data-edit>REPLACE label</span></div>
    </div>
  </div>
</div>
