<!-- Process flow. A line draws and a dot travels along it.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-flow">
    <div class="track">
      <div class="rail"><i></i><span class="dot"></span></div>
      <div class="node" style="--i:0"><span class="n" data-edit>01</span><h3>REPLACE</h3><p>REPLACE</p></div>
      <div class="node" style="--i:1"><span class="n" data-edit>02</span><h3>REPLACE</h3><p>REPLACE</p></div>
      <div class="node" style="--i:2"><span class="n" data-edit>03</span><h3>REPLACE</h3><p>REPLACE</p></div>
    </div>
  </div>
</div>
