<!-- Live feed. A list scrolls without end. Use it for mood, not for detail.
     Give .fs-comp a size inside the slide. Replace every REPLACE with the user's real content. -->
<div class="fs-comp" style="width:100%;height:100%">
  <div class="c-feed" data-fs="feed" data-items='[["REPLACE time","REPLACE text","hi","High"],["REPLACE time","REPLACE text","lo","Low"]]'>   <!-- level: hi, md or lo -->
    <ul></ul>
  </div>
</div>
